name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config make openjdk-17-jdk-headless zip unzip

      - name: Install Buildozer
        run: pip install buildozer cython==0.29.37

      - name: Auto Accept Android License
        run: yes | buildozer android accept_license

      - name: Build APK Release
        run: buildozer android debug
