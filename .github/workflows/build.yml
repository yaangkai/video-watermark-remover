name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: kivy/buildozer:latest
      volumes:
        - /root/.buildozer:/root/.buildozer
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build APK
        run: |
          cd android
          buildozer android debug
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: watermark-remover-apk
          path: android/bin/*.apk
          retention-days: 30
