name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          pip install buildozer==1.5.0 cython==3.0.10
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool libtool-bin pkg-config cmake \
            default-jdk zip unzip lld \
            libffi-dev libssl-dev
      
      - name: Build APK
        run: |
          cd android
          # 让 buildozer 下载 SDK
          buildozer android debug || true
          
          # 接受 license
          SDK_ROOT=~/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK_ROOT/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$SDK_ROOT/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          
          # 安装 build-tools
          yes | "$SDK_ROOT/tools/bin/sdkmanager" --sdk_root="$SDK_ROOT" "build-tools;33.0.0" "platforms;android-33" "platform-tools"
          
          # 再次运行 buildozer
          buildozer android debug
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: watermark-remover-apk
          path: android/bin/*.apk
          retention-days: 30
